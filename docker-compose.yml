name: tailnord-${INSTANCE_NAME}

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailnord-tailscale-${INSTANCE_NAME}
    hostname: tailnord-tailscale
    command: [
      '/scripts/tailscale_up.sh'
    ]
    user: root
    restart: always
    volumes:
      - "/dev/net/tun:/dev/net/tun"
      - "./tailscale/state:/var/lib/tailscale"
      - "./tailscale/scripts:/scripts"
    environment:
      - TAILSCALE_UP_LOGIN_SERVER=${TAILSCALE_UP_LOGIN_SERVER}
      - IP_NORDVPN=${IP_NORDVPN}
      - IP_ADGUARD=${IP_ADGUARD}
      - INSTANCE_NAME=${INSTANCE_NAME}
    cap_add:
      - net_admin
      - sys_module
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      tailnord-net:
        ipv4_address: ${IP_TAILSCALE}

  nordvpn:
    build:
      context: nordvpn
    container_name: tailnord-nordvpn-${INSTANCE_NAME}
    hostname: tailnord-nordvpn
    entrypoint: [
      '/scripts/nordvpn_up.sh'
    ]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - NORDVPN_TOKEN=${NORDVPN_TOKEN}
      - NORDVPN_ENDPOINT=${NORDVPN_ENDPOINT}
      - NORDVPN_TECHNOLOGY=${NORDVPN_TECHNOLOGY}
      - NORDVPN_OPENVPN_PROTOCOL=${NORDVPN_OPENVPN_PROTOCOL}
      - IP_SUBNET=${IP_SUBNET}
    volumes:
      - "/dev/net/tun:/dev/net/tun"
      - "./nordvpn/scripts:/scripts"
    cap_add:
      - net_admin
      - sys_module
    networks:
      tailnord-net:
        ipv4_address: ${IP_NORDVPN}

  adguard:
    image: adguard/adguardhome:latest
    container_name: tailnord-adguard-${INSTANCE_NAME}
    hostname: tailnord-adguard
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - "./adguard/workdir:/opt/adguardhome/work"
      - "./adguard/conf:/opt/adguardhome/conf"
    networks:
      tailnord-net:
        ipv4_address: ${IP_ADGUARD}

networks:
  tailnord-net:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${IP_SUBNET}
